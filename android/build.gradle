group 'net.touchcapture.qr.flutterqrplus'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        // minSdk 21: floor shared by CameraX and the zxing-cpp Android wrapper.
        // (Was 20 with zxing-android-embedded; Flutter itself requires >= 21,
        // so no consuming app loses support.)
        minSdkVersion 21
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        // // // coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (project.android.hasProperty('namespace')) {
        namespace 'net.touchcapture.qr.flutterqrplus'
    }
}

dependencies {
    // Camera stack: zxing-android-embedded (unmaintained since 2021, Camera1 API)
    // was replaced by CameraX (Google-maintained, Camera2-based).
    def camerax_version = '1.5.2'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Decoder: zxing-cpp is an actively maintained C++ port of ZXing with an
    // Android/Kotlin wrapper that decodes CameraX ImageProxy frames directly
    // (respecting ImageProxy.cropRect for scan-area restriction). It replaces
    // both com.google.zxing:core and the zxing-android-embedded decoder.
    implementation 'io.github.zxing-cpp:android:3.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
