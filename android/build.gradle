group = 'net.touchcapture.qr.flutterqrplus'
version = '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Kotlin comes from AGP's built-in Kotlin support, or from the Kotlin Android
// plugin that the Flutter Gradle plugin applies when an app turns that off.
apply plugin: 'com.android.library'

android {
    namespace = 'net.touchcapture.qr.flutterqrplus'
    compileSdk = 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.zxing:core:3.5.4'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
