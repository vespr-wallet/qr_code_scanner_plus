name: iOS tests

on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'example/ios/**'
      - 'example/lib/**'
      - 'example/pubspec.yaml'
      - 'tool/test_ios.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'example/ios/**'
      - 'example/lib/**'
      - 'example/pubspec.yaml'
      - 'tool/test_ios.sh'
      - '.github/workflows/ios.yml'

# One run per PR: branches get only the pull_request run, and a new push to a
# PR cancels its stale run. Pushes to master always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orientation:
    # ponytail: Intel (x64) runner because GitHub's arm64 macOS pool is starved
    # (jobs are cancelled without ever getting a runner). Move back to macos-15
    # (arm64) once capacity recovers, or before macos-15-intel is retired (~Aug 2027).
    runs-on: macos-15-intel
    timeout-minutes: 45 # Intel runners take 22-30 min; 25 was sized for arm64.
    steps:
      - uses: actions/checkout@v7
      - name: Boot an iOS simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -er '
            .devices | to_entries
            | map(select(.key | contains(".iOS-")) | .value[])
            | .[0].udid
          ')"
          xcrun simctl bootstatus "$device_id" -b
          echo "udid=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run orientation regression tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: ios/Tests/run_orientation_tests.sh "$SIMULATOR_UDID"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Run plugin registration regression tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: tool/test_ios.sh "platform=iOS Simulator,id=$SIMULATOR_UDID"
