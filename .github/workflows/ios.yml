name: iOS tests

on:
  push:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'example/ios/**'
      - 'example/lib/**'
      - 'example/pubspec.yaml'
      - 'tool/test_ios.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'example/ios/**'
      - 'example/lib/**'
      - 'example/pubspec.yaml'
      - 'tool/test_ios.sh'
      - '.github/workflows/ios.yml'

jobs:
  orientation:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Boot an iOS simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -er '
            .devices | to_entries
            | map(select(.key | contains(".iOS-")) | .value[])
            | .[0].udid
          ')"
          xcrun simctl bootstatus "$device_id" -b
          echo "udid=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run orientation regression tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: ios/Tests/run_orientation_tests.sh "$SIMULATOR_UDID"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Run plugin registration regression tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: tool/test_ios.sh "platform=iOS Simulator,id=$SIMULATOR_UDID"
